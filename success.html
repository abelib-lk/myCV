<!DOCTYPE html>
<html lang="en" class="no-js" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message sent — Asanka B. Ekanayake</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>
        (function () {
            var root = document.documentElement;
            root.classList.remove('no-js');
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
            } catch (e) { /* ignore */ }
        })();
    </script>
</head>

<body>
    <div class="background-shapes" aria-hidden="true">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <main class="container" style="min-height: 100vh; justify-content: center;">
        <section class="glass-panel" style="text-align: center; max-width: 560px; margin: 0 auto;">
            <p style="font-size: 3rem; color: #22c55e; margin-bottom: 1rem;">
                <i class="fas fa-circle-check" aria-hidden="true"></i>
            </p>
            <h1 class="profile-name" style="font-size: 2rem;">Message sent</h1>
            <p>Thanks for reaching out — your message has landed. I'll get back to you as soon as I can.</p>
            <a href="/" class="cta-button" style="margin-top: 1rem;">
                <i class="fas fa-arrow-left" aria-hidden="true"></i> Back to portfolio
            </a>
        </section>
    </main>
</body>

</html>
